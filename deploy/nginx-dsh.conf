# ============================================================
# dsh web 反向代理（含 SSE 流式支持）
#
# 用法:
#   1. 替换 dsh.example.com 为你的域名
#   2. 证书路径按实际调整（示例为 Let's Encrypt）
#   3. 拷贝到 /etc/nginx/conf.d/dsh.conf 后 nginx -t && systemctl reload nginx
#
# 要点（对照代码事实）:
#   - dsh web 默认只绑 127.0.0.1:3080，远程访问必须反代或 SSH 隧道
#   - 插件上传上限 50MB（index.ts MAX = 52_428_800），client_max_body_size 留余量
#   - /app/sessions/follow 是 text/event-stream：插件已带 20s 心跳和
#     x-accel-buffering: no 响应头，这里再显式关掉 proxy_buffering 双保险
# ============================================================

server {
    listen 80;
    server_name dsh.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name dsh.example.com;

    ssl_certificate     /etc/letsencrypt/live/dsh.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dsh.example.com/privkey.pem;

    # 上传上限：插件单文件 50MB，留余量
    client_max_body_size 60m;

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 升级（官方 UI 可能使用）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # SSE 流式（/app/sessions/follow 等）：禁缓冲 + 长读超时
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
